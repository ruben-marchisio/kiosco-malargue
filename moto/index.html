<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🏍️ Panel Repartidor — Kiosco Malargüe</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b0c10" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/moto/css/moto.css" />
    <script src="/js/config.js"></script>
  </head>
  <body>
    <!-- ── LOGIN ── -->
    <div id="login-screen">
      <div class="login-card">
        <div class="login-logo">
          <span class="icon">🏍️</span>
          <h1>Panel Repartidor</h1>
          <p>Kiosco Digital · Malargüe</p>
        </div>
        <form id="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="repartidor@kiosco.com" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn-login">Ingresar →</button>
          <p class="login-error" id="login-error"></p>
        </form>
      </div>
    </div>

    <!-- ── APP PRINCIPAL ── -->
    <div id="app-screen" hidden>
      <!-- Header -->
      <header class="moto-header">
        <div class="rep-info">
          <span class="rep-name" id="rep-name">Repartidor</span>
          <span class="trip-badge">🏍️ <span id="trip-count">0</span> viajes hoy</span>
        </div>
        <button class="btn-logout" id="logout-btn" title="Cerrar sesión">🚪</button>
      </header>

      <!-- Tab Bar -->
      <nav class="tab-bar">
        <button class="tab-btn active" data-tab="radar" id="tab-btn-radar">
          <span class="tab-icon">📡</span>
          <span>Radar</span>
          <span class="tab-count hidden" id="count-radar">0</span>
        </button>
        <button class="tab-btn" data-tab="disponibles" id="tab-btn-disponibles">
          <span class="tab-icon">🟢</span>
          <span>Disponibles</span>
          <span class="tab-count hidden" id="count-disponibles">0</span>
        </button>
        <button class="tab-btn" data-tab="mi-viaje" id="tab-btn-viaje">
          <span class="tab-icon">🏍️</span>
          <span>Mi Viaje</span>
        </button>
        <button class="tab-btn" data-tab="hoy" id="tab-btn-hoy">
          <span class="tab-icon">📊</span>
          <span>Hoy</span>
        </button>
      </nav>

      <!-- Contenido -->
      <div class="tab-content">
        <!-- TAB: Radar (pedidos en preparación) -->
        <section class="tab-panel active" id="tab-radar">
          <div id="radar-list">
            <div class="radar-idle">
              <div class="radar-circle">📡</div>
              <p>Escaneando pedidos en preparación...</p>
            </div>
          </div>
        </section>

        <!-- TAB: Disponibles (listos para retirar) -->
        <section class="tab-panel" id="tab-disponibles">
          <div id="disponibles-list">
            <div class="state-empty">
              <div class="icon">🟢</div>
              <p>No hay pedidos listos por ahora</p>
            </div>
          </div>
        </section>

        <!-- TAB: Mi Viaje activo -->
        <section class="tab-panel" id="tab-mi-viaje">
          <div id="viaje-content">
            <div class="state-empty">
              <div class="icon">🛵</div>
              <p>No tenés un viaje activo</p>
            </div>
          </div>
        </section>

        <!-- TAB: Balance del día -->
        <section class="tab-panel" id="tab-hoy">
          <div class="hoy-section">
            <p class="hoy-title">📊 Resumen de hoy</p>
            <div style="display: flex; gap: 12px; margin-bottom: 16px">
              <div class="hoy-card" style="flex: 1">
                <div>
                  <div class="hoy-num" id="hoy-viajes">0</div>
                  <div class="hoy-label">Viajes</div>
                </div>
                <span style="font-size: 32px">🏍️</span>
              </div>
              <div class="hoy-card" style="flex: 1">
                <div>
                  <div class="hoy-num" id="hoy-ingresos">$0</div>
                  <div class="hoy-label">En envíos</div>
                </div>
                <span style="font-size: 32px">💰</span>
              </div>
            </div>
            <p class="hoy-title">Viajes completados</p>
            <div id="hoy-list">
              <div class="state-empty" style="padding: 32px 20px">
                <p>Aún no completaste viajes hoy</p>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>

    <script type="module" src="/moto/js/moto.js"></script>
  </body>
</html>
